    SearchPageLinkParams:
      properties:
        label:
          description: Arbitrary string for tracking and reporting.
          type: string
        urls:
          description: The list of search page URLs. Each item must be a valid URI.
          items:
            type: string
          type: array
      type: object
    SearchQuery:
      properties:
        hotelIds:
          description: The list of hotel IDs to query.
          items:
            type: string
          maxItems: 50
          minItems: 1
          type: array
        hotelIdsProvider:
          description: |-
            used with the hotelIds query to specify the provider code of
            the hotels to query/map.
          type: string
        hotelNames:
          $ref: '#/components/schemas/HotelNamesQuery'
        iataCode:
          description: IATA code of an airport.
          type: string
        lat:
          description: Latitude in degrees
          format: double
          type: number
        lon:
          description: Longitude in degrees
          format: double
          type: number
        place:
          $ref: '#/components/schemas/PlaceQuery'
        placeId:
          description: Place ID to query.
          type: string
        precision:
          description: >-
            PrecisionRanges specifies the precision for geographic search
            results, defined

            as a string in "from-value" format, where each pair influences how results are

            grouped by distance for ranking purposes.


            Each pair in PrecisionRanges is written as "from-value", where `from` is the

            starting distance (in meters) and `value` defines the precision for that range.

            For example, "0-100" will group all results starting from 0 meters at a precision

            of 100 meters, meaning all results within a 0-99 meter radius are ranked equally.


            Multiple ranges can be specified as comma-separated pairs, such as

            "0-25,1000-2000". In this example, results from 0–999 m have a precision of 25 m,

            and results from >= 1000 m are grouped with a precision of 2000 m.


            This follows Algolia's aroundPrecision semantics for range objects.


            This format allows flexible, non-linear precision grouping to optimize geo-ranking

            by reducing overly precise calculations for distant results.
          type: string
        radius:
          description: radius in meters
          format: int64
          type: integer
      type: object
    SearchRequest:
      properties:
        anonymousId:
          description: Unique ID identifying users.
          type: string
        attributes:
          description: The list of extra attributes to include in a response.
          enum:
            - availableHotelsCount
          items:
            type: string
          type: array
        checkIn:
          description:
            Check in date (YYYY-MM-DD). If specified, must be within 0 and 365
            days from today.
          example: 2021-10-10
          format: date
          type: string
        checkOut:
          description:
            Check out date (YYYY-MM-DD). If specified, must be between 1 and 31
            days after check-in.
          example: 2021-10-11
          format: date
          type: string
        currency:
          default: EUR
          description: 3-char ISO 4217 currency code.
          example: EUR
          maxLength: 3
          minLength: 3
          type: string
        filters:
          $ref: '#/components/schemas/Filters'
        hotelAttributes:
          description: The list of extra hotel attributes to include in a response.
          enum:
            - details
          items:
            type: string
          type: array
        label:
          description: Arbitrary string for tracking and reporting.
          type: string
        language:
          description:
            Language code that will be used for translation of strings for
            humans.
          enum:
            - ar
            - bg
            - ca
            - cs
            - cz
            - da
            - de
            - en
            - en-GB
            - es
            - et
            - fi
            - fr
            - he
            - hr
            - hu
            - id
            - is
            - it
            - iw
            - ja
            - ko
            - lt
            - lv
            - ms
            - nl
            - no
            - nb
            - nn
            - pl
            - pt
            - pt-BR
            - ro
            - ru
            - sk
            - sl
            - sr
            - sv
            - th
            - tl
            - tr
            - uk
            - vi
            - zh
            - zh-CN
            - zh-TW
            - zh-HK
            - es-MX
            - el
            - bn
            - fil
            - fr-CA
            - hi
            - mr
          example: en
          type: string
        optimizeRooms:
          description: >-
            When enabled, the most cost-effective room combinations will be
            searched for a given occupancy

            (`rooms` field). For example, for 6 people, it will compare offers across different configurations

            like one 6-person room ("6"), two 3-person rooms ("3|3"), or three 2-person rooms ("2|2|2"),

            returning only the best option per hotel. This feature is not enabled by default, reach the support

            if you are going to use it.
          type: boolean
        pageSize:
          default: 20
          description: Max number of hotels in a response.
          format: int64
          maximum: 20
          minimum: 1
          type: integer
        query:
          $ref: '#/components/schemas/SearchQuery'
        rooms:
          default: '2'
          description: Room configuration.
          type: string
        sortField:
          description: Sort criteria.
          enum:
            - price
            - guestRating
          example: price
          type: string
        sortOrder:
          default: ascending
          description: Sort order.
          enum:
            - ascending
            - descending
          example: ascending
          type: string
        timeout:
          description: >-
            Maximum time in seconds to process a request. Setting this timeout
            allows to receive a response without

            waiting for offers from slow providers, but it also may lead to an incomplete or empty list of offers in a response.
          format: int64
          type: integer
        userCountry:
          description:
            The 2-char ISO 3166 country code of a user. If not specified then
            API determines it based on the caller's IP address.
          maxLength: 2
          minLength: 2
          type: string
        userDevice:
          description:
            The type of the user's device. If not specified then API determines
            it based on the caller's User-Agent header.
          enum:
            - desktop
            - mobile
            - tablet
          example: desktop
          type: string
      required:
        - query
        - language
        - currency
        - userDevice
        - userCountry
      type: object
    SearchResponse:
      properties:
        availableHotelsCount:
          description: >-
            An approximate count of available hotels. For popular places, it's
